name: Build LaTeX

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.sty'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic titling parskip cleveref listings caption xcolor psnfss graphics latexmk

      - name: Compile
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error protocol.tex

      - name: Generate release timestamp
        id: timestamp
        run: echo "value=$(date -u +'%d/%m-%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: protocol-${{ steps.timestamp.outputs.value }}
          name: Protocol ${{ steps.timestamp.outputs.value }}
          body: Automatically generated PDF from the LaTeX GitHub Actions workflow.
          files: protocol.pdf
          make_latest: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: protocol
          path: protocol.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Pages directory
        run: |
            mkdir -p public
            cp protocol.pdf public/
  
            cat > public/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Protocol</title>
              <style>
                * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                }
  
                html, body {
                  width: 100%;
                  height: 100%;
                  overflow: hidden;
                }
  
                iframe {
                  width: 100%;
                  height: 100%;
                  border: none;
                }
              </style>
            </head>
            <body>
              <iframe src="./protocol.pdf" title="Protocol PDF">
                <p>
                  Your browser cannot display PDFs.
                  <a href="./protocol.pdf">Download the PDF</a>.
                </p>
              </iframe>
            </body>
            </html>
            EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
